name: Claude Code commit stats

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate charts
        run: node scripts/claude-commit-stats.mjs
        env:
          # Classic PAT with the `repo` scope, so private and collaborator repos are counted.
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/claude-stats
          git diff --cached --quiet || git commit -m "Update Claude Code commit stats"
          git push
